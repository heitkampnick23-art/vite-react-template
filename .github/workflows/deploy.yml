# Deploys the site (worker + static assets) to Cloudflare on every push to main.
# Replaces the Cloudflare Workers Builds git integration, which has been
# failing silently since May — this is now the production deploy path.
#
# Requires one repository secret: CLOUDFLARE_API_TOKEN — repo Settings -> Secrets
# (Settings → Secrets and variables → Actions → New repository secret,
#  created from the "Edit Cloudflare Workers" token template.)

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Accept the token from any of the common places/names it may have been
      # saved under (Actions secret is preferred; repo variable also works but
      # is less protected — migrate it to a secret when convenient).
      - name: Resolve deploy token
        id: token
        env:
          S1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S2: ${{ secrets.CF_API_TOKEN }}
          S3: ${{ secrets.CLOUDFLARE_TOKEN }}
          S4: ${{ secrets.CLOUDFLARE_API_KEY }}
          V1: ${{ vars.CLOUDFLARE_API_TOKEN }}
          V2: ${{ vars.CF_API_TOKEN }}
        run: |
          TOKEN="${S1:-${S2:-${S3:-${S4:-${V1:-$V2}}}}}"
          report() { [ -n "$2" ] && echo "  $1: FOUND" || echo "  $1: not set"; }
          echo "Token sources checked:"
          report "secret CLOUDFLARE_API_TOKEN" "$S1"
          report "secret CF_API_TOKEN" "$S2"
          report "secret CLOUDFLARE_TOKEN" "$S3"
          report "secret CLOUDFLARE_API_KEY" "$S4"
          report "variable CLOUDFLARE_API_TOKEN" "$V1"
          report "variable CF_API_TOKEN" "$V2"
          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudflare token found in any Actions secret or variable. Add one: repo Settings → Secrets and variables → Actions → New repository secret, name CLOUDFLARE_API_TOKEN. Note: Codespaces/Dependabot secrets and other repos are NOT visible here."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm run build

      # Deploys were broken from May 19 to Jul 16, so production D1 missed the
      # migrations that landed in that window. Apply them idempotently here;
      # "duplicate column" failures just mean the schema is already current.
      - name: Sync production D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: 4d259cf98fff468b0108b6a80b7a10fc
        run: |
          npx wrangler d1 execute generate-ai --remote --command "CREATE TABLE IF NOT EXISTS twin_config (key TEXT PRIMARY KEY, value TEXT NOT NULL, iv TEXT, updated_at INTEGER NOT NULL)" \
            || echo "::warning::twin_config create skipped (token may lack D1 permission)"
          npx wrangler d1 execute generate-ai --remote --command "ALTER TABLE users ADD COLUMN password_hash TEXT" \
            || echo "password_hash column already present or token lacks D1 permission (ok)"

      # One-time credential bootstrap: twin-bootstrap.enc (if present) holds
      # twin_config INSERTs encrypted with the deploy token as passphrase, so
      # the public repo only ever contains ciphertext. Remove the file once
      # the config has landed.
      - name: Bootstrap twin credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: 4d259cf98fff468b0108b6a80b7a10fc
        run: |
          if [ -f twin-bootstrap.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -base64 -pass pass:"$CLOUDFLARE_API_TOKEN" -in twin-bootstrap.enc -out /tmp/twin-bootstrap.sql
            npx wrangler d1 execute generate-ai --remote --file /tmp/twin-bootstrap.sql > /dev/null && echo "twin credentials planted"
            rm -f /tmp/twin-bootstrap.sql
          else
            echo "no bootstrap file — skipping"
          fi

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: 4d259cf98fff468b0108b6a80b7a10fc
        run: npx wrangler deploy

      # An old session saved SECRETS_MASTER_KEY with a leading space in its
      # name, so env.SECRETS_MASTER_KEY has always been undefined (nothing was
      # ever encrypted with it — safe to mint fresh). Idempotent: only sets it
      # when the correctly-named secret is absent.
      - name: Ensure master encryption key
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: 4d259cf98fff468b0108b6a80b7a10fc
        run: |
          if npx wrangler secret list | grep -q '"SECRETS_MASTER_KEY"'; then
            echo "master key present"
          else
            openssl rand -base64 32 | npx wrangler secret put SECRETS_MASTER_KEY
            echo "master key minted"
          fi

      # The account's 5-cron limit is already used by other workers, so kick
      # the twin's idempotent self-wiring endpoint after each deploy instead.
      - name: Wire twin
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: 4d259cf98fff468b0108b6a80b7a10fc
        run: |
          for i in 1 2 3; do
            curl -sf https://generateai.build/api/twin/wire && break || sleep 10
          done
          echo ""
          echo "--- worker secrets present (names only):"
          npx wrangler secret list || true
